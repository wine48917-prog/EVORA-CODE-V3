
name: Build EVORA CODE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Find EVORA project folder
        shell: bash
        run: |
          INDEX_FILE=$(find . -maxdepth 4 -type f -name index.html \
            -not -path '*/node_modules/*' | head -n 1)

          if [ -z "$INDEX_FILE" ]; then
            echo "ERROR: index.html not found"
            exit 1
          fi

          APP_DIR=$(dirname "$INDEX_FILE")
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "Found project in: $APP_DIR"

      - name: Prepare Capacitor
        shell: bash
        run: |
          cd "$APP_DIR"

          npm init -y

          npm install @capacitor/core@7 \
            @capacitor/android@7 \
            @capacitor/cli@7

          mkdir -p www

          find . -mindepth 1 -maxdepth 1 \
            ! -name www \
            ! -name android \
            ! -name node_modules \
            ! -name .git \
            ! -name .github \
            ! -name package.json \
            ! -name package-lock.json \
            -exec cp -R {} www/ \;

          npx cap init "EVORA CODE" "com.wine.evoracode" --web-dir=www

          npx cap add android

      - name: Sync Android
        run: |
          cd "$APP_DIR"
          npx cap sync android

      - name: Build APK
        run: |
          cd "$APP_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload EVORA APK
        uses: actions/upload-artifact@v4
        with:
          name: EVORA-CODE-ANDROID
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
